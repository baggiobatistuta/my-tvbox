name: TVBox 自动检测源

on:
  schedule:
    - cron: '0 2,14 * * *'   # 每天 UTC 2:00 和 14:00（北京时间 10:00 / 22:00）
  workflow_dispatch:         # 允许手动运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 运行检测脚本
        run: python check.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/multi.txt
          git commit -m "🤖 自动更新存活源 $(date +'%Y-%m-%d %H:%M')" || exit 0
          git push
